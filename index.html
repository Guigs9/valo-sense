<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valo-Sense</title>

    <style>
        body {
            margin: 0;
            background: #0f1117;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        video {
            width: 100%;
            max-height: 500px;
            background: black;
            border-radius: 12px;
        }

        .question {
            margin-top: 25px;
            font-size: 22px;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 18px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.02);
        }

        #result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>VALO-SENSE</h1>

    <video id="video" controls>
        <source src="ClipscoupduAug182026.mp4" type="video/mp4">
        Ton navigateur ne peut pas lire cette vidéo.
    </video>

    <div class="question">
        Que dois-tu faire ?
    </div>

    <div class="answers">

        <button onclick="answer(false)">
            A — Repeek
        </button>

        <button onclick="answer(true)">
            B — Jouer le temps
        </button>

        <button onclick="answer(false)">
            C — Partir chercher l'ennemi
        </button>

        <button onclick="answer(false)">
            D — Recharger immédiatement
        </button>

    </div>

    <div id="result"></div>

</div>

<script>

function answer(correct) {

    const result = document.getElementById("result");

    if (correct) {
        result.innerHTML = "✅ BON CHOIX !";
    } else {
        result.innerHTML = "❌ MAUVAIS CHOIX !";
    }

}

</script>

</body>
</html>
